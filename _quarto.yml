project:
  type: book

lang: de

execute:
  freeze: auto

book:
  title: "Data Science, AI & Analytics Toolkit"
  description: "Programming Toolkit für Data Science, AI & Analytics"

  image: "/images/logo.png"
  favicon: "/images/logo.png"
  search:
    type: overlay  
  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2024

  chapters:
    - index.qmd

    - part: erste-schritte/index.qmd
      chapters:
        - erste-schritte/projektumgebung.qmd 
        - erste-schritte/python-und-idle.qmd
        - erste-schritte/python-idle.qmd
        - erste-schritte/anaconda-installation.qmd
        - erste-schritte/jupyter-notebook.qmd
        - erste-schritte/markdown.qmd

    - part: python/index.qmd
      chapters:
        - text: "Bausteine"
          href: python/python-bausteine.qmd
        - text: "Umgebungen"
          href: python/python-umgebung.qmd
        - python/python-arbeitsbereich.qmd
        - python/python-grundlagen.qmd #neu
        - python/python-einrueckung.qmd #neu
        - python/python-funktionen.qmd #neu
        - python/python-kontrollstrukturen.qmd #neu
        - python/python-klassen.qmd #neu

    - part: vscode/index.qmd
      chapters:
        - vscode/visual-studio-code-installation.qmd
        - vscode/visual-studio-code-basics.qmd

    - part: daten/index.qmd
      chapters:
        - text: "CSV"      
          href: daten/csv.qmd
        - text: "JSON"           
          href: daten/json.qmd 
        - text: "Datenbanken"
          href: daten/datenbanken.qmd              
        - text: "PostgreSQL"
          href: daten/postgresql.qmd 
        - text: "MySQL"
          href: daten/mysql.qmd           
        - text: "MongoDB"
          href: daten/mongodb.qmd    
      


    - part: github/index.qmd
      chapters:
        - github/github-git.qmd
        - github/github-setup.qmd
        - github/github-repo.qmd
        - github/github-organization.qmd
        - github/github-projects.qmd   


format:
  html:
    toc: true
    theme: cosmo
    css: theme.scss
    code-copy: true
    highlight-style: github-dark
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
    include-in-header:
      - text: |
          <script src="password.js"></script>

