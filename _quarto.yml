          href: python/python-bibliotheken.qmd
        - text: "Umgebungen"
          href: python/python-umgebung.qmd
        - python/python-arbeitsbereich.qmd
        - python/python-basics.qmd
        - python/python-einrueckung.qmd
        - python/python-funktionen.qmd
        - python/python-control-flow.qmd
        - python/python-klassen.qmd

    - part: vscode/index.qmd
      chapters:
