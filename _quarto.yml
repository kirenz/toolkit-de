        - postgres/postgres-installation.qmd
        - postgres/postgres-server.qmd
        - postgres/postgres-basics.qmd
        - postgres/postgres-python.qmd

    - part: mongodb/index.qmd
      chapters:
        - mongodb/mongodb-installation.qmd 
