project:
  type: book

lang: de

execute:
  freeze: auto

book:
  title: "Data Science, AI & Analytics Toolkit"
  description: "Programming Toolkit für Data Science, AI & Analytics"

  image: "/images/logo.png"
  favicon: "/images/logo.png"
  search:
    type: overlay  
  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2024

  chapters:
