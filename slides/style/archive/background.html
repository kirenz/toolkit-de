<style>
    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    @keyframes colorChange {
      0% { fill: rgba(255, 255, 255, 0.1); }
      50% { fill: rgba(100, 100, 255, 0.2); }
      100% { fill: rgba(255, 255, 255, 0.1); }
    }
    
    .reveal .slide-background-content {
      background: linear-gradient(45deg, #000033, #000066, #0000cc, #3333ff);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      position: relative;
      overflow: hidden;
    }
    
    .background-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    .background-shape {
      animation: colorChange 10s infinite alternate;
    }
    
    .reveal h1, .reveal h2, .reveal p {
      color: #ffffff;
      position: relative;
      z-index: 1;
    }
    
    .reveal h1 {
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    
    .reveal h2 {
      font-size: 1.8em;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }
    
    .reveal p {
      font-size: 1.2em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    </style>
    
    <svg class="background-shapes" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <circle class="background-shape" cx="10" cy="10" r="20" />
      <circle class="background-shape" cx="90" cy="90" r="30" />
      <path class="background-shape" d="M50,0 Q100,50 50,100 Q0,50 50,0 Z" />
      <rect class="background-shape" x="70" y="0" width="30" height="50" />
      <ellipse class="background-shape" cx="20" cy="80" rx="15" ry="10" />
    </svg>
